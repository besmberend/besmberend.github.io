<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Только для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e11; --wine:#7a1c2e; --wine-l:#a83247; --cream:#e8dfd5; --gold:#c9a96a;
  --glass:rgba(255,255,255,.04); --line:rgba(232,223,213,.14);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(120% 80% at 50% 0%,#1d1219 0%,var(--bg) 60%);color:var(--cream);font-family:var(--sans);font-weight:300;line-height:1.7;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
h1,h2,h3{font-family:var(--serif);font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- Экран входа ---------- */
#lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:var(--bg);transition:opacity 1.2s ease,visibility 1.2s}
#lock.gone{opacity:0;visibility:hidden}
#lock h1{font-size:clamp(2.6rem,11vw,4rem);font-style:italic;letter-spacing:.01em;margin-bottom:.6rem}
#lock p.hint{font-size:.9rem;opacity:.7;margin-bottom:2rem;max-width:30ch}
.seal{width:54px;height:54px;border-radius:50%;margin-bottom:1.8rem;background:radial-gradient(circle at 35% 30%,var(--wine-l),var(--wine) 60%,#4a0f1b);box-shadow:0 4px 18px rgba(122,28,46,.55),inset 0 -3px 6px rgba(0,0,0,.4);display:grid;place-items:center;font-family:var(--serif);font-size:1.5rem;color:rgba(232,223,213,.85)}
#lockForm{display:flex;flex-direction:column;align-items:center;gap:1rem;width:min(320px,100%)}
#pw{width:100%;text-align:center;font:400 1.4rem var(--serif);letter-spacing:.18em;color:var(--cream);background:var(--glass);border:1px solid var(--line);border-radius:3px;padding:.85rem 1rem;backdrop-filter:blur(8px)}
#pw::placeholder{opacity:.35;letter-spacing:.1em}
#pw:focus{outline:none;border-color:var(--gold)}
.btn{background:var(--wine);border:1px solid rgba(255,255,255,.12);padding:.8rem 2.2rem;border-radius:3px;font-size:.85rem;letter-spacing:.08em;transition:background .3s,transform .2s}
.btn:hover{background:var(--wine-l)} .btn:active{transform:scale(.97)}
#err{min-height:1.5em;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:#d98b97;opacity:0;transition:opacity .4s}
#err.show{opacity:1}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ---------- Открытка ---------- */
main{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:4.5rem 1.4rem 5rem}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s ease}
.reveal.in{opacity:1;transform:none}
header{text-align:center;margin-bottom:4rem}
header h1{font-size:clamp(2.4rem,10vw,3.6rem);line-height:1.1;font-style:italic}
.date{margin-top:1rem;font-family:var(--serif);font-size:1.3rem;letter-spacing:.2em;color:var(--gold)}
.divider{display:flex;align-items:center;gap:.9rem;justify-content:center;margin:1.4rem auto 0;max-width:260px;color:var(--gold)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider::after{transform:scaleX(-1)}
section{margin-bottom:4.5rem}
section>h2{text-align:center;font-size:1.9rem;font-style:italic;margin-bottom:1.6rem}
#music{position:fixed;top:max(1rem,env(safe-area-inset-top));right:1rem;z-index:20;width:42px;height:42px;border-radius:50%;background:rgba(15,14,17,.6);border:1px solid var(--line);backdrop-filter:blur(8px);display:grid;place-items:center;transition:border-color .3s}
#music svg{width:18px;height:18px;fill:none;stroke:var(--cream);stroke-width:1.5;stroke-linecap:round}
#music.on{border-color:var(--gold)} #music.on svg{stroke:var(--gold)}
#music .off{display:none} #music:not(.on) .off{display:block}

/* Письмо */
.letter{position:relative;padding:2.2rem 1.7rem;border-radius:3px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(232,223,213,.07),rgba(232,223,213,.03)),repeating-linear-gradient(0deg,transparent 0 31px,rgba(232,223,213,.05) 31px 32px);box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.letter::before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,169,106,.18);pointer-events:none}
.letter p{font-family:var(--serif);font-size:1.25rem;line-height:1.75;margin-bottom:1.1rem}
.letter p:first-child::first-letter{font-size:3.2rem;float:left;line-height:.9;padding:.25rem .5rem 0 0;color:var(--gold)}
.sign{text-align:right;font-style:italic;color:var(--gold)}

/* Таймер */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.timer{display:grid;grid-template-columns:repeat(4,1fr);padding:1.6rem .6rem;text-align:center}
.timer div+div{border-left:1px solid var(--line)}
.timer b{display:block;font:400 clamp(2rem,9vw,2.8rem)/1.1 var(--serif);color:var(--gold);font-variant-numeric:tabular-nums}
.timer span{font-size:.72rem;opacity:.65;letter-spacing:.05em}
.timer-note{text-align:center;margin-top:1rem;font-size:.85rem;opacity:.6}

/* Полароиды */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem 1rem;padding:.5rem}
.polaroid{background:#ece4d6;padding:.55rem .55rem 0;border:0;box-shadow:0 10px 24px rgba(0,0,0,.5);transform:rotate(var(--r));transition:transform .35s;text-align:center;color:#2a2026}
.polaroid:hover,.polaroid:focus-visible{transform:rotate(0) scale(1.04)}
.polaroid .ph{aspect-ratio:1;background:linear-gradient(135deg,#3a1f28,#1b1418);overflow:hidden}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.35) contrast(.95) saturate(.85)}
.polaroid em{display:block;font:italic 1.05rem var(--serif);padding:.5rem 0 .6rem}
#lightbox{position:fixed;inset:0;z-index:40;background:rgba(10,8,11,.94);display:none;align-items:center;justify-content:center;padding:1.4rem;flex-direction:column}
#lightbox.open{display:flex;animation:fade .35s}
@keyframes fade{from{opacity:0}}
#lightbox figure{max-width:min(520px,100%);background:#ece4d6;padding:.8rem .8rem 1.2rem;color:#2a2026;text-align:center;box-shadow:0 20px 60px #000}
#lightbox img{width:100%;max-height:58vh;object-fit:contain;display:block;background:#1b1418}
#lightbox figcaption{font:italic 1.2rem/1.5 var(--serif);margin-top:.9rem}
.close{position:absolute;top:max(1rem,env(safe-area-inset-top));right:1rem;background:none;border:1px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:1.3rem;line-height:1}

/* Конверт */
.env-wrap{display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.env{position:relative;width:min(300px,86%);aspect-ratio:3/2;background:none;border:0;perspective:900px}
.env .back,.env .front,.env .flap{position:absolute;left:0;right:0}
.env .back{inset:0;background:#2a1019;border-radius:3px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.env .front{bottom:0;top:0;background:linear-gradient(135deg,transparent 50%,#4a1424 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 50%,#4a1424 50%) right/50% 100% no-repeat;z-index:3;border-radius:3px}
.env .flap{top:0;height:58%;background:linear-gradient(180deg,#5a1a2b,#431220);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease,z-index 0s .4s;z-index:4}
.env .stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--wine-l),var(--wine) 60%,#4a0f1b);box-shadow:0 3px 10px rgba(0,0,0,.6);display:grid;place-items:center;font:1.3rem var(--serif);transition:opacity .4s}
.env .paper{position:absolute;left:7%;right:7%;bottom:6%;height:80%;background:#ece4d6;z-index:2;border-radius:2px;transition:transform .9s .5s ease}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .stamp{opacity:0}
.env.open .paper{transform:translateY(-62%)}
.env-hint{font-size:.9rem;opacity:.7}
.secret{max-width:100%;text-align:center;padding:2rem 1.6rem;opacity:0;max-height:0;overflow:hidden;transition:opacity 1s 1.2s,max-height 1s 1.2s;border-color:rgba(201,169,106,.4)}
.secret.show{opacity:1;max-height:600px}
.secret h3{font-size:1.7rem;font-style:italic;color:var(--gold);margin-bottom:.8rem}
.secret p{font-family:var(--serif);font-size:1.2rem;line-height:1.7}
.coupon{margin-top:1.4rem;padding:1rem;border:1px dashed var(--gold);font-family:var(--serif);font-size:1.15rem}
footer{text-align:center;font-family:var(--serif);font-style:italic;opacity:.6;font-size:1.1rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body class="locked">
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<!-- ===== ЭКРАН ВХОДА ===== -->
<div id="lock">
  <div class="seal">&amp;</div>
  <h1>Только для тебя</h1>
  <p class="hint">Введи дату нашей свадьбы, чтобы открыть</p>
  <form id="lockForm" autocomplete="off">
    <input id="pw" type="text" inputmode="numeric" placeholder="дд.мм.гггг" aria-label="Пароль — дата свадьбы">
    <button class="btn" type="submit">Открыть</button>
    <div id="err" role="alert">Попробуй вспомнить, когда наступит этот особенный день...</div>
  </form>
</div>

<!-- Контент лежит в <template>: до ввода пароля его нет в DOM -->
<template id="card">
<button id="music" aria-label="Включить музыку" title="Музыка">
  <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="off" d="M3 3l18 18"/></svg>
</button>
<!-- 🎵 АУДИО: вставь ссылку на свой mp3 (например, music/song.mp3) -->
<audio id="audio" loop preload="none" src="song.mp3"></audio>

<main>
  <header class="reveal">
    <h1>Мы женимся</h1>
    <!-- ✏️ ДАТА СВАДЬБЫ: задаётся в WEDDING_DATE_TEXT в настройках скрипта -->
    <div class="date" id="weddingDateText">5 · 12 · 2026</div>
    <div class="divider">✦</div>
  </header>

  <section class="reveal">
    <h2>Письмо</h2>
    <div class="letter">
      <!-- ✏️ ТЕКСТ ПИСЬМА: замени абзацы на свои -->
      <p>Моя любимая девочка, я не силен в написании любовных посланий, но словами не передать мои чувства к тебе. Что бы между нами не происходило, я всегда храню в сердце большое и теплое чувство, которое, пожалуй, никогда не угаснет.</p>
      <p>Я люблю в тебе всё: твою улыбку, твои руки, в которых мне спокойно, и то, как ты ласково целуешь меня и называешь зайчиком.</p>
      <p>Мы прошли через многое: как большие радости, так и долгие ссоры. Но всегда выбирали друг друга, выбирали прожить все вместе. Не потому, что так надо, а потому, что иначе никак, без нашей большой любви нас нет.</p>
      <p>Уже скоро мы скажем друг другу «да», но вот для меня оно звучит уже давно. Спасибо, что ты есть. Я с тобой — в любую погоду, в любые годы.</p>
      <p class="sign">Навсегда твой</p>
    </div>
  </section>

  <section class="reveal">
    <h2>Мы вместе уже</h2>
    <div class="glass timer" id="timer">
      <div><b id="t-d">0</b><span>дней</span></div>
      <div><b id="t-h">0</b><span>часов</span></div>
      <div><b id="t-m">0</b><span>минут</span></div>
      <div><b id="t-s">0</b><span>секунд</span></div>
    </div>
    <p class="timer-note">с начала наших отношений</p>
  </section>

  <section class="reveal">
    <h2>Наши моменты</h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="reveal">
    <h2>Капсула будущего</h2>
    <div class="env-wrap">
      <button class="env" id="env" aria-label="Открыть конверт">
        <div class="back"></div><div class="paper"></div><div class="front"></div>
        <div class="flap"></div><div class="stamp">&amp;</div>
      </button>
      <p class="env-hint" id="envHint">Нажми, чтобы открыть секретное обещание</p>
      <div class="glass secret" id="secret">
        <!-- ✏️ СЕКРЕТНОЕ ПОСЛАНИЕ / КУПОН -->
        <h3>Обещание</h3>
        <p>Обещаю быть рядом, когда легко, и ещё ближе, когда трудно. И каждый год писать тебе новое письмо.</p>
        <div class="coupon">Купон на день для двоих: только ты, я и целый день, который проведем, как ты пожелаешь.</div>
      </div>
    </div>
  </section>

  <footer class="reveal">С любовью, навсегда</footer>
</main>

<div id="lightbox" role="dialog" aria-modal="true">
  <button class="close" id="lbClose" aria-label="Закрыть">×</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
</div>
</template>

<script>
/* ================= НАСТРОЙКИ — меняй здесь ================= */

// 🔑 ПАРОЛИ (только цифры; точки и пробелы при вводе игнорируются).
// Сейчас принимаются: 05.12.2026, 5.12.2026, 05.12.26, 05.12, 5.12, а также 12.05 и 12.05.2026 (американский порядок).
const PASSWORDS = ['05122026', '5122026', '051226', '51226', '0512', '512', '1205', '12052026'];

// 💒 Дата свадьбы для заголовка: 5 декабря 2026
const WEDDING_DATE_TEXT = '5 · 12 · 2026';

// 💍 Дата первой встречи для таймера (формат ГГГГ-ММ-ДДTчч:мм:сс): 24 марта 2023, 23:00
const MEET_DATE = new Date('2023-03-24T23:00:00');

// 📷 ФОТО: замени src на свои файлы (images/photo1.jpg ...) и поправь подписи.
// caption — подпись под полароидом, memory — скрытое воспоминание в окне просмотра.
const PHOTOS = [
  { src: "Image1.jpg", caption: 'Парная аватарка', memory: 'Я помню, как пытались подобрать удачный кадр. Всё-таки получилось)' },
  { src: 'Image2.jpg', caption: 'На концерте',     memory: 'Хоть я и вредничал, было приятно провести вместе время и попеть.' },
  { src: 'Image3.jpg', caption: 'Целуемся',  memory: 'Сняли как красиво целуемся на фото, люблю иногда пересматривать.' },
  { src: 'Image4.jpg', caption: 'Смешные',  memory: 'Не быть же серьезными постоянно, правильно?' },
  { src: 'Image5.jpg', caption: 'На шашлыках',        memory: 'Стоим вместе у залива, красиво.' },
  { src: 'Image6.jpg', caption: '«Мостик»',          memory: 'Спонтанное фото, в спонтанном месте. Помню, как смущалась)' }
];
/* =========================================================== */

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');

/* ---------- Фон: парящие частицы ---------- */
(function bg(){
  const c = $('#bg'), x = c.getContext('2d'); let W, H, P = [];
  const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  size(); addEventListener('resize', size);
  for (let i = 0; i < 45; i++) P.push({x:Math.random(), y:Math.random(), r:Math.random()*1.6+.4, v:Math.random()*.00012+.00004, p:Math.random()*6.28});
  (function draw(t){
    x.clearRect(0,0,W,H);
    for (const p of P){
      p.y -= p.v; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      const a = .25 + .35*Math.sin(t/1200 + p.p);
      x.beginPath(); x.arc(p.x*W + Math.sin(t/3000+p.p)*12, p.y*H, p.r, 0, 6.28);
      x.fillStyle = `rgba(201,169,106,${Math.max(a,.05)})`; x.fill();
    }
    requestAnimationFrame(draw);
  })(0);
})();

/* ---------- Вход по паролю ---------- */
$('#lockForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#pw').value.replace(/\D/g, '');
  if (PASSWORDS.includes(v)) return unlock();
  const f = $('#lockForm'), err = $('#err');
  err.classList.add('show'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
});
$('#pw').addEventListener('input', () => $('#err').classList.remove('show'));

function unlock(){
  document.body.appendChild($('#card').content.cloneNode(true)); // контент появляется в DOM только сейчас
  $('#lock').classList.add('gone');
  document.body.classList.remove('locked');
  setTimeout(() => $('#lock').remove(), 1400);
  initCard();
}

/* ---------- Инициализация открытки ---------- */
function initCard(){
  $('#weddingDateText').textContent = WEDDING_DATE_TEXT;
  // Появление блоков при скролле
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), {threshold:.15});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  // Музыка
  const a = $('#audio'), m = $('#music');
  m.onclick = () => {
    if (!a.getAttribute('src')) return alert('Добавь ссылку на mp3 в <audio src="...">');
    if (a.paused) { a.play().catch(()=>{}); m.classList.add('on'); } else { a.pause(); m.classList.remove('on'); }
  };

  // Таймер
  const tick = () => {
    let s = Math.max(0, Math.floor((Date.now() - MEET_DATE) / 1000));
    $('#t-d').textContent = Math.floor(s/86400);
    $('#t-h').textContent = pad(Math.floor(s/3600)%24);
    $('#t-m').textContent = pad(Math.floor(s/60)%60);
    $('#t-s').textContent = pad(s%60);
  };
  tick(); setInterval(tick, 1000);

  // Галерея + Lightbox
  const rot = [-3,2.5,-1.5,3,-2.5,1.5];
  PHOTOS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'polaroid'; b.style.setProperty('--r', rot[i % rot.length] + 'deg');
    b.setAttribute('aria-label', 'Открыть фото: ' + p.caption);
    b.innerHTML = `<div class="ph"><img loading="lazy" alt="${p.caption}" src="${p.src}"></div><em>${p.caption}</em>`;
    b.querySelector('img').onerror = e => e.target.remove(); // если фото не загрузилось — остаётся тёмная заглушка
    b.onclick = () => { $('#lbImg').src = p.src; $('#lbImg').alt = p.caption; $('#lbCap').textContent = p.memory; $('#lightbox').classList.add('open'); };
    $('#gallery').appendChild(b);
  });
  const lb = $('#lightbox');
  $('#lbClose').onclick = () => lb.classList.remove('open');
  lb.onclick = e => { if (e.target === lb) lb.classList.remove('open'); };
  addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });

  // Конверт
  $('#env').onclick = () => {
    const env = $('#env'); if (env.classList.contains('open')) return;
    env.classList.add('open'); $('#envHint').style.visibility = 'hidden';
    setTimeout(() => { $('#secret').classList.add('show'); confetti(); }, 900);
    setTimeout(() => $('#secret').scrollIntoView({behavior:'smooth', block:'center'}), 1700);
  };
}

/* ---------- Золотое конфетти ---------- */
function confetti(){
  const c = $('#confetti'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#c9a96a','#e8d3a0','#a8854a','#7a1c2e','#e8dfd5'];
  const P = Array.from({length:130}, () => ({
    x: Math.random()*c.width, y: -20 - Math.random()*c.height*.6, w: 5+Math.random()*5, h: 8+Math.random()*8,
    vy: 1.2+Math.random()*2.2, vx: (Math.random()-.5)*1.2, a: Math.random()*6, va: (Math.random()-.5)*.15, col: cols[Math.floor(Math.random()*cols.length)]
  }));
  const end = performance.now() + 6500;
  (function f(t){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p => {
      p.y += p.vy; p.x += p.vx + Math.sin(p.a)*.6; p.a += p.va;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.col;
      x.globalAlpha = t < end ? .9 : Math.max(0, .9 - (t-end)/800);
      x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore();
    });
    if (t < end + 800) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height);
  })(performance.now());
}
</script>
